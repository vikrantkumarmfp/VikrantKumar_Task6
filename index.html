<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left">
        <img src="laundryMart.png" alt="laundrymart" />
      </div>
      <div class="right">
        <section id="greeting">
          <h2>Hello Again!</h2>
          <p>Welcome back! We missed you!</p>
        </section>

        <section id="login">
          <form action="">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              minlength="5"
              placeholder="Email@site.com"
              maxlength="12"
              required
            />
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              minlength="5"
              placeholder="password"
              maxlength="12"
              required
            />
            <button id="forget">Forget Password</button>
            <button>Login</button>
            <p>Not a member?</p>
            <button id="register">Register Now</button>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
