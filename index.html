<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="left">
        <img src="laundryMart.png" alt="laundrymart" />
      </div>
      <div class="right">
        <section id="greeting">
          <h2>Hello Again!</h2>
          <p>Welcome back! We missed you!</p>
        </section>

        <section id="login">
          <form action="">
            <div class="igroup">
              <label for="email">Email</label>
              <input
                id="email"
                type="email"
                minlength="5"
                placeholder="Email@site.com"
                maxlength="28"
                required
              />
            </div>
            <div class="passbox">
              <div class="igroup">
                <label for="password">Password</label>
                <input
                  id="password"
                  type="password"
                  minlength="5"
                  placeholder="password"
                  maxlength="28"
                  required
                />
              </div>

              <button id="forget" type="reset">Forget Password</button>
            </div>
            <button id="loginBtn" type="submit">Login</button>
            <div class="registerbox">
              <p>Not a member?</p>
              <button id="register">Register Now</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
